spring:
  datasource:
    url: jdbc:h2:mem:myclaw-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
